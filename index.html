<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#801126"><title>Market Visit</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>
*{box-sizing:border-box}html,body,#app{height:100%;margin:0;font-family:Arial,sans-serif;color:#172033}#app{display:grid;grid-template-rows:auto auto 1fr auto;background:#f4f6f9}.top{background:linear-gradient(120deg,#6f0b20,#ad1834);color:#fff;padding:13px 15px}.top b{font-size:18px}.top small{display:block;opacity:.8;margin-top:3px}.ctrl{display:grid;grid-template-columns:130px 1fr auto;gap:8px;padding:9px;background:#fff;border-bottom:1px solid #ddd}.ctrl select,.ctrl input,.ctrl button{height:42px;border:1px solid #d8dde6;border-radius:12px;padding:0 10px;min-width:0}.ctrl button{background:#0c2340;color:#fff;font-weight:bold}.wrap{position:relative;min-height:0}#map{height:100%}.gate,.load{position:absolute;inset:0;z-index:800;display:grid;place-items:center;background:#f4f6f9eF;padding:20px}.load{display:none}.load.on{display:grid}.box{background:#fff;border-radius:20px;padding:22px;max-width:380px;width:100%;text-align:center;box-shadow:0 15px 40px #0002}.box select,.box button{width:100%;height:46px;margin-top:10px;border-radius:12px}.box select{border:1px solid #ddd;padding:0 10px}.box button{border:0;background:#a3112b;color:#fff;font-weight:bold}.stat{position:absolute;z-index:600;top:10px;left:10px;background:#fff;border-radius:20px;padding:8px 11px;font-size:12px;font-weight:bold;box-shadow:0 4px 15px #0002}.dot{width:28px;height:28px;border:3px solid #fff;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:10px;font-weight:bold;box-shadow:0 2px 8px #0004}.hi{background:#c9203f}.md{background:#dc8a23}.lo{background:#2773aa}.nav{display:grid;grid-template-columns:1fr 1fr 1fr;background:#fff;border-top:1px solid #ddd}.nav button{border:0;background:#fff;padding:10px;color:#6b7280;font-weight:bold}.nav button.on{color:#a3112b}.panel{position:fixed;inset:0;z-index:1000;background:#f4f6f9;display:none;overflow:auto;padding-bottom:65px}.panel.on{display:block}.ph{position:sticky;top:0;background:#fff;padding:14px;border-bottom:1px solid #ddd}.ph h2{margin:0 0 10px}.ph input{width:100%;height:42px;border:1px solid #ddd;border-radius:12px;padding:0 10px}.list{padding:10px}.store,.q{background:#fff;border:1px solid #e2e6ed;border-radius:15px;padding:13px;margin-bottom:9px}.store b{display:block}.meta{font-size:11px;color:#687386;margin-top:4px}.score{color:#a3112b;font-size:11px;font-weight:bold;margin-top:9px}.drawer{position:fixed;z-index:1200;left:0;right:0;bottom:0;max-height:85vh;background:#fff;border-radius:24px 24px 0 0;box-shadow:0 -14px 40px #0003;transform:translateY(105%);transition:.2s;overflow:auto}.drawer.on{transform:none}.dh{padding:18px;border-bottom:1px solid #ddd}.dc{padding:15px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.card{border:1px solid #e0e4eb;border-radius:13px;padding:11px}.card small{color:#687386}.card strong{display:block;font-size:22px;margin-top:5px}.row{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px dashed #ddd;font-size:13px}.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}.acts button,.add{border:0;border-radius:12px;padding:12px;font-weight:bold}.primary{background:#a3112b;color:#fff}.secondary{background:#edf1f6;color:#0c2340}.q textarea{width:100%;min-height:90px;border:1px solid #ddd;border-radius:10px;margin-top:8px;padding:9px}.q [contenteditable]{font-weight:bold}.del{float:right;border:0;background:#fee;color:#900;border-radius:7px}.add{margin:10px;width:calc(100% - 20px)}@media(min-width:750px){.drawer{left:auto;right:18px;bottom:18px;width:420px;border-radius:24px}.panel{left:auto;width:430px;box-shadow:-10px 0 30px #0002}}
</style></head><body><div id="app"><header class="top"><b>Market Visit Cheatsheet</b><small>Priority Visit Nearby</small></header><div class="ctrl"><select id="area"><option value="">Pilih area</option></select><input id="search" placeholder="Cari toko / territory"><button id="gps">◎ Lokasi</button></div><main class="wrap"><div id="map"></div><div id="stat" class="stat" hidden></div><div id="gate" class="gate"><div class="box"><div style="font-size:38px">📍</div><h2>Mulai market visit</h2><p>Pilih area supaya data dimuat bertahap dan tetap ringan di HP.</p><select id="pick"><option value="">Pilih area</option></select><button id="start">Tampilkan peta</button></div></div><div id="load" class="load"><div class="box"><h3>Memuat data area...</h3><div id="loadtxt"></div></div></div></main><nav class="nav"><button class="on" data-v="map">⌖ Map</button><button data-v="list">☷ Priority</button><button data-v="guide">✎ Interview</button></nav></div><section id="listp" class="panel"><div class="ph"><h2>Priority Visit Nearby</h2><input id="find" placeholder="Cari retailer..."></div><div id="list" class="list"></div></section><section id="guidep" class="panel"><div class="ph"><h2>Interview Guide</h2><div id="gstore" class="meta">General notes</div></div><div id="qs"></div><button id="addq" class="add primary">+ Tambah pertanyaan</button></section><div id="drawer" class="drawer"><div id="detail"></div></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
const AREAS=['SLSSDA','SLSSUB'];let DATA=[],rows=[],area='',map,user,marks=[],selected=null;const $=x=>document.getElementById(x),esc=x=>String(x??'-').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));const num=x=>Number(x)||0;
function valid(r){return Number.isFinite(r.lat)&&Number.isFinite(r.lng)&&r.lat!==0&&r.lng!==0&&r.lat>=-11&&r.lat<=6&&r.lng>=95&&r.lng<=141}function ago(x){if(!x)return 9999;return(Date.now()-new Date(x))/864e5}function pr(r){let s=0,x=[];if(r.seg==='NO JOURNEY'){s+=35;x.push('No Journey')}else if(r.seg==='DORMANT'){s+=25;x.push('Dormant')}if(r.otp!=='YES'){s+=15;x.push('Belum OTP')}if(!num(r.l4w)){s+=18;x.push('0 CITA L4W')}if(r.loyal!=='YES'){s+=12;x.push('Belum loyalty')}if(ago([r.lastC,r.lastA].filter(Boolean).sort().pop())>60){s+=12;x.push('Order lama')}return{n:s,x}}function dist(a,b,c,d){let p=Math.PI/180,A=Math.sin((c-a)*p/2)**2+Math.cos(a*p)*Math.cos(c*p)*Math.sin((d-b)*p/2)**2;return 12742*Math.asin(Math.sqrt(A))}
function init(){AREAS.forEach(a=>[$('area'),$('pick')].forEach(e=>e.add(new Option(a,a))));map=L.map('map',{preferCanvas:true}).setView([-7.3,112.7],10);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);$('start').onclick=()=>$('pick').value&&loadArea($('pick').value);$('area').onchange=e=>e.target.value&&loadArea(e.target.value);$('search').oninput=markers;$('find').oninput=list;$('gps').onclick=gps;document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>view(b.dataset.v));$('addq').onclick=addq;questions()}
async function loadArea(a){$('load').classList.add('on');$('loadtxt').textContent=a;try{let r=await fetch('./'+a.toLowerCase()+'.json?v=3');if(!r.ok)throw Error(r.status);DATA=await r.json();area=a;rows=DATA.filter(valid);$('area').value=$('pick').value=a;$('gate').style.display='none';markers();list();map.fitBounds(rows.map(r=>[r.lat,r.lng]),{padding:[20,20],maxZoom:14});$('stat').hidden=false;$('stat').textContent=rows.length.toLocaleString('id-ID')+' retailer mapped · '+(DATA.length-rows.length)+' GPS invalid'}catch(e){alert('Gagal load '+a+'. Pastikan file '+a.toLowerCase()+'.json di-upload satu folder dengan index.html.')}finally{$('load').classList.remove('on')}}
function markers(){marks.forEach(m=>m.remove());marks=[];let q=$('search').value.toLowerCase(),c=map.getCenter(),x=rows.filter(r=>!q||[r.name,r.code,r.t,r.ws].some(v=>String(v||'').toLowerCase().includes(q))).sort((a,b)=>dist(c.lat,c.lng,a.lat,a.lng)-dist(c.lat,c.lng,b.lat,b.lng)).slice(0,700);x.forEach(r=>{let p=pr(r),cl=p.n>=55?'hi':p.n>=30?'md':'lo',ic=L.divIcon({className:'',html:`<div class="dot ${cl}">${p.n}</div>`,iconSize:[28,28]});marks.push(L.marker([r.lat,r.lng],{icon:ic}).addTo(map).on('click',()=>detail(r)))})}
function list(){let q=$('find').value.toLowerCase(),u=user&&user.getLatLng(),x=rows.filter(r=>!q||[r.name,r.code,r.t].some(v=>String(v||'').toLowerCase().includes(q))).map(r=>[r,pr(r),u?dist(u.lat,u.lng,r.lat,r.lng):null]);x.sort((a,b)=>u?a[2]-b[2]:b[1].n-a[1].n);$('list').innerHTML=x.slice(0,250).map(([r,p,d],i)=>`<div class="store" onclick="openCode('${r.code}')"><b>${i+1}. ${esc(r.name)}</b><div class="meta">${esc(r.code)} · ${esc(r.t)} · ${esc(r.seg)}${d!==null?' · '+d.toFixed(1)+' km':''}</div><div class="score">Priority ${p.n} · ${p.x.slice(0,2).join(', ')}</div></div>`).join('')}
window.openCode=c=>{let r=DATA.find(x=>x.code===c);detail(r)};function detail(r){selected=r;let p=pr(r);$('detail').innerHTML=`<div class="dh"><h2>${esc(r.name)}</h2><div class="meta">${esc(r.code)} · ${esc(r.a)} / ${esc(r.t)} · Priority ${p.n}</div></div><div class="dc"><div class="grid">${card('Total order',r.total)}${card('CITA L4W',r.l4w)}${card('CITA lifetime',r.cl)}${card('AYO lifetime',r.al)}</div>${row('Segment',r.seg)}${row('Wholesaler',esc(r.wsc)+' · '+esc(r.ws))}${row('OTP',r.otp)}${row('Last order CITA',r.lastC)}${row('Last order AYO',r.lastA)}${row('Loyalty',r.loyal)}${row('Mission type',r.mission)}<div class="score">${p.x.join(' · ')}</div><div class="acts"><button class="secondary" onclick="goGuide()">✎ Interview</button><button class="primary" onclick="nav(${r.lat},${r.lng})">➜ Navigate</button></div></div>`;$('drawer').classList.add('on')};function card(a,b){return`<div class="card"><small>${a}</small><strong>${num(b).toLocaleString('id-ID')}</strong></div>`}function row(a,b){return`<div class="row"><span>${a}</span><b>${esc(b)}</b></div>`}window.nav=(a,b)=>window.open(`https://www.google.com/maps/dir/?api=1&destination=${a},${b}`,'_blank');window.goGuide=()=>{$('drawer').classList.remove('on');view('guide');questions()};
function gps(){navigator.geolocation.getCurrentPosition(p=>{let x=[p.coords.latitude,p.coords.longitude];user?user.setLatLng(x):user=L.circleMarker(x,{radius:9,color:'#fff',weight:3,fillColor:'#1769aa',fillOpacity:1}).addTo(map);map.setView(x,15);markers();list()},()=>alert('GPS tidak tersedia. Pastikan izin lokasi browser aktif.'),{enableHighAccuracy:true})}function view(v){document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));$('listp').classList.toggle('on',v==='list');$('guidep').classList.toggle('on',v==='guide');if(v==='map')setTimeout(()=>map.invalidateSize(),50);if(v==='list')list();if(v==='guide')questions()}
const DQ=['Apa tujuan utama retailer menggunakan CITA?','Apa kendala saat login, OTP, atau order?','Mengapa retailer masih memilih AYO atau bantuan field force?','Apa yang dibutuhkan agar retailer lebih sering order mandiri?'];function getq(){try{return JSON.parse(localStorage.mv_q)||DQ}catch(e){return DQ}}function nk(){return selected?'mv_n_'+selected.code:'mv_n_general'}function questions(){let n={};try{n=JSON.parse(localStorage.getItem(nk()))||{}}catch(e){}$('gstore').textContent=selected?selected.name+' · '+selected.code:'General notes';$('qs').innerHTML=getq().map((q,i)=>`<div class="q"><button class="del" onclick="delq(${i})">Hapus</button><div contenteditable onblur="editq(${i},this.textContent)">${esc(q)}</div><textarea oninput="ans(${i},this.value)">${esc(n[i]||'')}</textarea></div>`).join('')}window.ans=(i,v)=>{let n={};try{n=JSON.parse(localStorage.getItem(nk()))||{}}catch(e){}n[i]=v;localStorage.setItem(nk(),JSON.stringify(n))};window.editq=(i,v)=>{let q=getq();q[i]=v;localStorage.mv_q=JSON.stringify(q)};window.delq=i=>{let q=getq();q.splice(i,1);localStorage.mv_q=JSON.stringify(q);questions()};function addq(){let q=getq();q.push('Pertanyaan baru');localStorage.mv_q=JSON.stringify(q);questions()}init();
</script></body></html>
